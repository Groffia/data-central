name: Release

# Lesson: push release tags one at a time (git push origin <tag>), never several with --tags or one push, or GitHub may start no run.
# Actions are pinned to versions below; do not switch them to floating refs.

on:
  push:
    tags:
      - 'hq-v*'
      - 'pipeline-v*'
      - 'value-v*'
      - 'brain-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Engine tests
        run: cd engine && node --test tests/
      - name: Shared tests
        run: node --test shared/tests/
      - name: HQ tests
        run: cd hq && node --test tests/
      - name: Pipeline tests
        run: cd pipeline && node --test tests/
      - name: Value tests
        run: cd value && node --test tests/
      - name: Brain tests
        run: cd brain && node --test tests/
      - name: Script tests
        run: node --test scripts/
      - name: Build site
        run: node scripts/build-site.js
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PAGE="${GITHUB_REF_NAME%%-v*}"
          gh release create "$GITHUB_REF_NAME" "site/$PAGE/$PAGE-single.html" --title "Data Central $GITHUB_REF_NAME" --notes "Single-file demo (open it from disk or attach it to an email), built from this tag. Source and notes: README.md in the page folder."
