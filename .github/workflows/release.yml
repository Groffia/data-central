name: Release

on:
  push:
    tags:
      - 'hq-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Engine tests
        run: cd engine && node --test tests/
      - name: HQ tests
        run: cd hq && node --test tests/
      - name: Script tests
        run: node --test scripts/
      - name: Build site
        run: node scripts/build-site.js
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" site/hq/hq-single.html --title "HQ $GITHUB_REF_NAME" --notes "Single-file HQ demo (open it from disk or attach it to an email), built from this tag. Source and notes: README.md in the hq folder."
